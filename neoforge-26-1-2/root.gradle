// Keep the Forge/1.21.1 build on Gradle 8; this module uses its own Gradle 9 wrapper.
def isWindows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
def wrapper = isWindows ? ['cmd', '/d', '/c', 'gradlew.bat'] : ['sh', './gradlew']
def forwardedProperties = gradle.startParameter.projectProperties.collect { key, value -> "-P${key}=${value}".toString() }
def forwardedFlags = gradle.startParameter.offline ? ['--offline'] : []
def forwardedInitScripts = gradle.startParameter.initScripts.collectMany { ['-I', it.absolutePath] }
def forwardedSystemProperties = gradle.startParameter.systemPropertiesArgs.collect { key, value -> "-D${key}=${value}".toString() }

['clean', 'assemble', 'build', 'check', 'compileJava', 'test',
 'runData', 'runClient', 'runServer', 'runGameTestServer', 'neoForgeIdeSync'].each { taskName ->
    tasks.register(taskName, Exec) {
        group = '26.1.2'
        description = "Runs ${taskName} with the 26.1.2 Gradle wrapper."
        workingDir projectDir
        commandLine wrapper + [taskName, '--console=plain', '--no-daemon', '--no-configuration-cache',
                "--max-workers=${gradle.startParameter.maxWorkerCount}"] + forwardedFlags + forwardedProperties + forwardedSystemProperties + forwardedInitScripts
    }
}

tasks.matching { it.name != 'clean' }.configureEach {
    mustRunAfter tasks.named('clean')
}

tasks.named('build') {
    mustRunAfter tasks.named('runData')
}
