name: Publish Extended Molecular Assembler Release

run-name: Publish ${{ github.event.release.tag_name || inputs.release_tag }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to publish or retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifact
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      dependencies: ${{ steps.metadata.outputs.dependencies }}
      jar: ${{ steps.metadata.outputs.jar }}
      java_version: ${{ steps.metadata.outputs.java_version }}
      mc_version: ${{ steps.metadata.outputs.mc_version }}
      mod_loader: ${{ steps.metadata.outputs.mod_loader }}
      mod_version: ${{ steps.metadata.outputs.mod_version }}
      module: ${{ steps.metadata.outputs.module }}
      version_type: ${{ steps.metadata.outputs.version_type }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          fetch-depth: 0

      - name: Verify tag belongs to the default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor HEAD "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "::error::Release tag ${RELEASE_TAG} does not point to a commit on ${DEFAULT_BRANCH}."
            exit 1
          fi

      - name: Read and validate release metadata
        id: metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PRERELEASE: ${{ github.event.release.prerelease || 'false' }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail

          read_property() {
            local property_name="$1"
            local properties_file="$2"
            sed -n "s/^${property_name}=//p" "$properties_file" | tr -d '\r' | tail -n 1
          }

          forge_properties="forge-1-20-1/gradle.properties"
          neoforge_properties="neoforge-1-21-1/gradle.properties"

          forge_mc_version="$(read_property minecraft_version "$forge_properties")"
          neoforge_mc_version="$(read_property minecraft_version "$neoforge_properties")"
          release_version="${RELEASE_TAG#v}"

          case "$release_version" in
            "${forge_mc_version}-"*)
              module="forge-1-20-1"
              properties_file="$forge_properties"
              ;;
            "${neoforge_mc_version}-"*)
              module="neoforge-1-21-1"
              properties_file="$neoforge_properties"
              ;;
            *)
              echo "::error::Unsupported release tag '${RELEASE_TAG}'."
              echo "::error::Use v${forge_mc_version}-<mod-version> or v${neoforge_mc_version}-<mod-version>."
              exit 1
              ;;
          esac

          mc_version="$(read_property minecraft_version "$properties_file")"
          mod_version="$(read_property mod_version "$properties_file")"
          myotus_version="$(read_property myotus_version "$properties_file")"
          mod_loader="$(read_property mod_loader "$properties_file")"
          version_type="$(read_property mod_version_type "$properties_file")"
          java_version="$(read_property java_version "$properties_file")"

          for required_value in mc_version mod_version myotus_version mod_loader version_type java_version; do
            if [[ -z "${!required_value:-}" ]]; then
              echo "::error::Missing ${required_value} in ${properties_file}."
              exit 1
            fi
          done

          if [[ "$mod_version" == *-SNAPSHOT || "$myotus_version" == *-SNAPSHOT ]]; then
            echo "::error::Release builds cannot use SNAPSHOT mod or Myotus versions."
            echo "::error::Found mod ${mod_version}, Myotus ${myotus_version} in ${properties_file}."
            exit 1
          fi

          if [[ ! "$mod_version" =~ ^[0-9]+(\.[0-9]+){2}([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Invalid mod_version '${mod_version}' in ${properties_file}."
            exit 1
          fi

          case "$version_type" in
            alpha|beta|release) ;;
            *)
              echo "::error::mod_version_type must be alpha, beta, or release; got '${version_type}'."
              exit 1
              ;;
          esac

          expected_version="${mc_version}-${mod_version}"
          if [[ "$release_version" != "$expected_version" ]]; then
            echo "::error::Release tag '${RELEASE_TAG}' must be 'v${expected_version}' (or '${expected_version}')."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "release" ]]; then
            is_prerelease="$EVENT_PRERELEASE"
          else
            if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null; then
              echo "::error::GitHub Release '${RELEASE_TAG}' does not exist."
              exit 1
            fi
            is_prerelease="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isPrerelease --jq '.isPrerelease')"
          fi

          if [[ "$version_type" == "release" && "$is_prerelease" == "true" ]]; then
            echo "::error::A release build cannot use a GitHub Pre-release."
            exit 1
          fi
          if [[ "$version_type" != "release" && "$is_prerelease" != "true" ]]; then
            echo "::error::An ${version_type} build must be published as a GitHub Pre-release."
            exit 1
          fi

          if [[ "$module" == "neoforge-1-21-1" ]]; then
            dependencies=$(cat <<'EOF'
          ae2(required){modrinth:XxWD5pD3}{curseforge:223794}
          myotus(required){modrinth:32YA23Pp}{curseforge:1496024}
          ae2wtlib(optional){modrinth:pNabrMMw}{curseforge:459929}
          extendedcrafting(optional){modrinth:5JMG1gql}{curseforge:268387}
          extendedae(optional){modrinth:JiOqfoFM}{curseforge:892005}
          extendedae-plus(optional){modrinth:xr109llC}{curseforge:1337639}
          advancedae(optional){modrinth:rxYaglEe}{curseforge:1084104}
          extended-terminal(optional){modrinth:SwdQUhgJ}{curseforge:1302078}
          avaritianeo(optional){modrinth:j5gjLUvf}{curseforge:1083158}
          re-avaritia(optional){modrinth:QeB3NRC5}{curseforge:623969}
          EOF
            )
          else
            dependencies=$(cat <<'EOF'
          ae2(required){modrinth:XxWD5pD3}{curseforge:223794}
          myotus(required){modrinth:32YA23Pp}{curseforge:1496024}
          ae2wtlib(required){modrinth:pNabrMMw}{curseforge:459929}
          extendedcrafting(optional){modrinth:5JMG1gql}{curseforge:268387}
          extendedae(optional){modrinth:JiOqfoFM}{curseforge:892005}
          extended-terminal(optional){modrinth:SwdQUhgJ}{curseforge:1302078}
          avaritianeo(optional){modrinth:j5gjLUvf}{curseforge:1083158}
          re-avaritia(optional){modrinth:QeB3NRC5}{curseforge:623969}
          EOF
            )
          fi

          artifact_name="ExtendedMolecularAssembler-${mc_version}-${mod_version}"

          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "jar=${artifact_name}.jar" >> "$GITHUB_OUTPUT"
          echo "java_version=${java_version}" >> "$GITHUB_OUTPUT"
          echo "mc_version=${mc_version}" >> "$GITHUB_OUTPUT"
          echo "mod_loader=${mod_loader}" >> "$GITHUB_OUTPUT"
          echo "mod_version=${mod_version}" >> "$GITHUB_OUTPUT"
          echo "module=${module}" >> "$GITHUB_OUTPUT"
          echo "version_type=${version_type}" >> "$GITHUB_OUTPUT"
          {
            echo 'dependencies<<EMA_DEPENDENCIES'
            printf '%s\n' "$dependencies"
            echo 'EMA_DEPENDENCIES'
          } >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist

          if [[ "$EVENT_NAME" == "release" ]]; then
            printf '%s\n' "$RELEASE_BODY" > dist/release-notes.md
          else
            gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json body --jq '.body' > dist/release-notes.md
          fi

          if [[ -z "$(tr -d '[:space:]' < dist/release-notes.md)" ]]; then
            if [[ -s CHANGELOG.md ]]; then
              cp CHANGELOG.md dist/release-notes.md
            else
              echo "::error::The GitHub Release body and CHANGELOG.md are both empty."
              exit 1
            fi
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: ${{ steps.metadata.outputs.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Build selected Minecraft version
        shell: bash
        env:
          RELEASE_MOD_VERSION: ${{ steps.metadata.outputs.mod_version }}
          TARGET_MODULE: ${{ steps.metadata.outputs.module }}
        run: |
          chmod +x ./gradlew
          ./gradlew ":${TARGET_MODULE}:build" \
            -Pmod_version="${RELEASE_MOD_VERSION}" \
            --build-cache \
            --no-configuration-cache \
            --no-daemon \
            --console=plain

      - name: Collect release artifact
        shell: bash
        env:
          JAR: ${{ steps.metadata.outputs.jar }}
          TARGET_MODULE: ${{ steps.metadata.outputs.module }}
        run: |
          set -euo pipefail

          artifact_path="${TARGET_MODULE}/build/libs/${JAR}"
          if [[ ! -f "$artifact_path" ]]; then
            echo "::error::Expected release jar was not produced: ${artifact_path}"
            find "${TARGET_MODULE}/build/libs" -maxdepth 1 -type f -name '*.jar' -print || true
            exit 1
          fi

          cp "$artifact_path" "dist/${JAR}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-payload
          path: dist/
          if-no-files-found: error
          retention-days: 7

  attach-github-release:
    name: Attach jar to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release payload
        uses: actions/download-artifact@v8
        with:
          name: release-payload
          path: dist

      - name: Upload jar to the existing release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          JAR: ${{ needs.build.outputs.jar }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "dist/${JAR}" --repo "$GH_REPO" --clobber

  publish-platforms:
    name: Publish ${{ needs.build.outputs.module }}
    needs:
      - build
      - attach-github-release
    runs-on: ubuntu-latest

    steps:
      - name: Download release payload
        uses: actions/download-artifact@v8
        with:
          name: release-payload
          path: dist

      - name: Verify publishing configuration
        shell: bash
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          missing=0

          for name in MODRINTH_PROJECT_ID MODRINTH_TOKEN CURSEFORGE_PROJECT_ID CURSEFORGE_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::GitHub Actions configuration ${name} is not set."
              missing=1
            fi
          done

          exit "$missing"

      - name: Verify release payload
        shell: bash
        env:
          JAR: ${{ needs.build.outputs.jar }}
        run: |
          set -euo pipefail
          test -s "dist/${JAR}"
          test -s dist/release-notes.md

      - name: Publish to Modrinth and CurseForge
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: ${{ needs.build.outputs.version_type == 'release' }}

          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          name: ${{ needs.build.outputs.artifact_name }}
          version: ${{ needs.build.outputs.mc_version }}-${{ needs.build.outputs.mod_version }}
          version-type: ${{ needs.build.outputs.version_type }}
          changelog-file: dist/release-notes.md
          files: dist/${{ needs.build.outputs.jar }}
          game-versions: ${{ needs.build.outputs.mc_version }}
          loaders: ${{ needs.build.outputs.mod_loader }}
          environment: "client | server"
          java: ${{ needs.build.outputs.java_version }}
          retry-attempts: 2
          retry-delay: 10000
          fail-mode: fail

          dependencies: ${{ needs.build.outputs.dependencies }}
