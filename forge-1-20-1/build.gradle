buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'maven-publish'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

java {
    toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version.toString()))
}

base {
    archivesName = "ExtendedMolecularAssembler-${minecraft_version}"
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'ema.checkClientStyles', 'true'
            property 'guideme.ae2.guide.sources', "${sourceSets.main.output.resourcesDir}/assets/${mod_id}/ae2guide"
            property 'guideme.ae2.guide.sourcesNamespace', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly fg.deobf("me.myogoo:myotus:${myotus_version}")
    compileOnly fg.deobf("appeng:appliedenergistics2-forge:${AE2_version}")
    compileOnly fg.deobf("org.appliedenergistics:guideme:${guideME_version}:api")
    compileOnly fg.deobf("maven.modrinth:applied-energistics-2-wireless-terminals:${AE2WTLib_version}")

    runtimeOnly fg.deobf("me.myogoo:myotus:${myotus_version}")
    runtimeOnly fg.deobf("appeng:appliedenergistics2-forge:${AE2_version}")
    runtimeOnly fg.deobf("org.appliedenergistics:guideme:${guideME_version}")

    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${JEI_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${JEI_version}")
    compileOnly fg.deobf("dev.emi:emi-forge:${EMI_version}")
    compileOnly fg.deobf("maven.modrinth:extended-crafting:${ExtendedCrafting_version}")
    compileOnly fg.deobf("maven.modrinth:cucumber:${Cucumber_version}")
    compileOnly fg.deobf("maven.modrinth:extended-ae:${ExtendedAE_version}")
    compileOnly fg.deobf("maven.modrinth:advancedae:${AdvancedAE_version}")
    compileOnly fg.deobf("io.github.pedroksl:ae2addonlib:${AE2AddonLib_version}-${minecraft_version}")
    compileOnly fg.deobf("maven.modrinth:glodium:${Glodium_version}")
    compileOnly fg.deobf("maven.modrinth:avaritianeo:${AvaritiaNeo_version}")
    compileOnly fg.deobf("maven.modrinth:re-avaritia:${ReAvaritia_version}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    if (project.itemListMod == 'jei') {
        runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${JEI_version}")
    }
    if (project.itemListMod == 'emi' || project.itemListMod == 'jemi') {
        runtimeOnly fg.deobf("dev.emi:emi-forge:${EMI_version}")
    }
    if (project.itemListMod == 'jemi') {
        runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${JEI_version}")
    }

    if (project.enable_excrafting == 'true') {
        runtimeOnly fg.deobf(project.findProperty('extendedCraftingRuntime')
                ?: "maven.modrinth:extended-crafting:${ExtendedCrafting_version}")
        runtimeOnly fg.deobf("maven.modrinth:cucumber:${Cucumber_version}")
    }

    if (project.enable_ae2wtlib == 'true') {
        runtimeOnly fg.deobf("maven.modrinth:applied-energistics-2-wireless-terminals:${AE2WTLib_version}")
        runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
        runtimeOnly fg.deobf("dev.architectury:architectury-forge:${architectury_version}")
        runtimeOnly fg.deobf("me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}")
    }

    if (project.enable_extendedae == 'true') {
        runtimeOnly fg.deobf("maven.modrinth:extended-ae:${ExtendedAE_version}")
        runtimeOnly fg.deobf("maven.modrinth:glodium:${Glodium_version}")
    }

    if (project.enable_advancedae == 'true') {
        runtimeOnly fg.deobf("maven.modrinth:advancedae:${AdvancedAE_version}")
        runtimeOnly fg.deobf("curse.maven:geckolib-388172:6920925")
    }

    switch (project.enable_avaritia) {
        case 'neo':
            runtimeOnly fg.deobf("maven.modrinth:avaritianeo:${AvaritiaNeo_version}")
            break
        case 're':
            runtimeOnly fg.deobf("maven.modrinth:re-avaritia:${ReAvaritia_version}")
            break
        case 'none':
            break
        default:
            throw new GradleException("Invalid value for enable_avaritia: ${project.enable_avaritia}")
    }
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    inputs.property 'guideExtendedAEId', 'expatternprovider'
    filesMatching('assets/extendedmolecularassembler/ae2guide/**/*.md') {
        filter { line -> line.replace('load="extendedae"', 'load="expatternprovider"') }
    }
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            myotus_version_range   : myotus_version_range
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
    manifest {
        attributes([
                'MixinConfigs'            : "${mod_id}.mixins.json",
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version.toString(),
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId = project.mod_group_id
            artifactId = project.mod_id
            version = project.mod_version
            artifact jar
        }
    }
    repositories {
        maven {
            name = 'projectLocal'
            url = rootProject.layout.projectDirectory.dir('repo').asFile.toURI()
        }
    }
}
