// Compile shared Java against each loader's dependencies and package shared assets once.
def loaderResourceDirs = [file('src/main/resources'), file('src/generated/resources')]
def generatedCommonResourcesDir = layout.buildDirectory.dir('generated/resources/emaCommon')
def syncEMACommonResources = tasks.register('syncEMACommonResources', Sync) {
    from '../common/src/main/resources'
    into generatedCommonResourcesDir
    exclude '**/.cache/**'
    inputs.files(loaderResourceDirs.collect { fileTree(it) })
            .withPropertyName('loaderResourceOverrides').withPathSensitivity(PathSensitivity.RELATIVE)
    exclude { details ->
        !details.directory && loaderResourceDirs.any { new File(it, details.relativePath.pathString).isFile() }
    }
}

sourceSets.main {
    java.srcDir project.file('../common/src/main/java')
    resources {
        srcDir files(generatedCommonResourcesDir).builtBy(syncEMACommonResources)
        exclude '**/.cache/**'
    }
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

// Development runs use source-set output; release jars must not contain test classes or fixtures.
tasks.named('jar', Jar).configure {
    exclude 'me/myogoo/extendedmolecularassembler/gametest/**'
    exclude '**/*GameTestHelper*.class', '**/QuantumCraftingGameTestChecks*.class'
    exclude '**/ExtendedPatternRecipeFinderChecks*.class', '**/EMAMatrixPatternCoreUpdatePacketChecks*.class'
    exclude 'data/extendedmolecularassembler/recipe/gametest/**'
    exclude 'data/extendedmolecularassembler/recipes/gametest/**'
    exclude 'data/extendedmolecularassembler/recipe/dev/**', 'data/extendedmolecularassembler/recipes/dev/**'
    exclude 'data/extendedmolecularassembler/structure/**', 'data/extendedmolecularassembler/structures/**'
}
