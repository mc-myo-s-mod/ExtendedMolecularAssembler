plugins {
    id 'base'
    id 'idea'
}

def loadProjectProperties = { Project target ->
    def propertiesFile = target.file('gradle.properties')
    if (!propertiesFile.isFile()) {
        return
    }

    def properties = new Properties()
    propertiesFile.withInputStream { properties.load(it) }
    properties.each { key, value ->
        def propertyName = key.toString()
        if (!target.hasProperty(propertyName)) {
            target.extensions.extraProperties.set(propertyName, value)
        }
    }
}

allprojects {
    loadProjectProperties(project)

    group = findProperty('mod_group_id') ?: 'me.myogoo'
    version = findProperty('mod_version') ?: 'unspecified'

    repositories {
        mavenCentral()
        maven { url = 'https://maven.blamejared.com/' }
        maven {
            name = 'ModMaven'
            url = 'https://modmaven.dev'
            content {
                includeGroup 'appeng'
                includeGroup 'de.mari_023'
            }
        }
        maven { url = 'https://maven.blakesmods.com' }
        maven {
            name = 'TerraformersMC'
            url = 'https://maven.terraformersmc.com/'
            content {
                includeGroup 'dev.emi'
            }
        }
        maven {
            name = 'Architectury'
            url = 'https://maven.architectury.dev/'
            content {
                includeGroup 'dev.architectury'
            }
        }
        maven {
            name = 'Shedaniel'
            url = 'https://maven.shedaniel.me/'
            content {
                includeGroup 'me.shedaniel.cloth'
            }
        }
        maven {
            name = 'Curios'
            url = 'https://maven.theillusivec4.top/'
            content {
                includeGroup 'top.theillusivec4.curios'
            }
        }
        maven { url = 'https://cursemaven.com' }
        maven { url = 'https://api.modrinth.com/maven' }
        maven {
            name = 'projectLocal'
            url = rootProject.layout.projectDirectory.dir('repo').asFile.toURI()
        }
    }
}

configure(subprojects.findAll { it.name != 'neoforge-26-1-2' }) {
    apply plugin: 'java'
    apply plugin: 'idea'

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}

def modProjects = [
        project(':forge-1-20-1'),
        project(':neoforge-1-21-1')
]

configure(project(':common')) {
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(17)
    }

    dependencies {
        // Lets the EMA common module resolve Myotus API annotations while editing shared sources.
        compileOnly "me.myogoo:myotus:${project(':forge-1-20-1').myotus_version}"
    }

    tasks.register('craftingChecks', JavaExec) {
        group = 'verification'
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'me.myogoo.extendedmolecularassembler.CommonCraftingChecks'
        enableAssertions = true
    }
    tasks.named('check').configure {
        dependsOn craftingChecks
    }
}

configure(modProjects) {
    apply from: rootProject.file('gradle/ema-common-sources.gradle')

    base {
        archivesName = "${project.mod_name}-${project.minecraft_version}"
    }
}

tasks.register('compileAllJava') {
    group = 'verification'
    description = 'Compiles all EMA version modules.'
    dependsOn ':neoforge-1-21-1:compileJava'
    dependsOn ':forge-1-20-1:compileJava'
    dependsOn ':neoforge-26-1-2:compileJava'
}

tasks.register('syncIntellij') {
    group = 'ide'
    description = 'Prepares IntelliJ metadata and run configurations for all EMA modules.'
    dependsOn ':forge-1-20-1:genIntellijRuns'
    dependsOn ':neoforge-1-21-1:neoForgeIdeSync'
    dependsOn ':neoforge-26-1-2:neoForgeIdeSync'
}
